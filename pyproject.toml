[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "n11-mcp"
version = "0.1.1"
description = "Unofficial read-only MCP server for n11.com shopping (search, product details, reviews, categories, price stats)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "curl-cffi>=0.7,<1.0",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
n11-mcp = "n11_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/n11_mcp"]
